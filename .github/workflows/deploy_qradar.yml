name: Deploy SIEM Rules to QRadar

on:
  push:
    branches: [main]
    paths:
      - "qradar/rules/**"
      - "qradar/deploy_qradar.py"
      - "qradar/requirements.txt"
      - ".github/workflows/deploy_qradar.yml"
  pull_request:
    paths:
      - "qradar/rules/**"
      - "qradar/deploy_qradar.py"
      - "qradar/requirements.txt"
      - ".github/workflows/deploy_qradar.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: pip install -r qradar/requirements.txt
      - name: Validate QRadar JSON rules
        shell: python
        run: |
          import glob
          import json

          required = {
              "name", "description", "severity", "gpo_policy",
              "mitre_attack", "event_ids", "expression", "cre_logic", "offense"
          }
          files = sorted(glob.glob("qradar/rules/*.json"))
          assert len(files) == 10, f"Expected 10 QRadar rule files, found {len(files)}"
          names = set()
          for path in files:
              with open(path, encoding="utf-8") as handle:
                  rule = json.load(handle)
              missing = required.difference(rule)
              assert not missing, f"{path}: missing {sorted(missing)}"
              assert set(rule) == required, f"{path}: unexpected fields {sorted(set(rule)-required)}"
              assert rule["name"] not in names, f"{path}: duplicate rule name"
              assert 1 <= int(rule["severity"]) <= 10, f"{path}: invalid severity"
              assert rule["expression"].strip().upper().startswith("SELECT "), f"{path}: invalid AQL start"
              assert " LAST " in rule["expression"].upper(), f"{path}: missing AQL time window"
              assert isinstance(rule["offense"], bool), f"{path}: offense must be boolean"
              names.add(rule["name"])
          print(f"Validated {len(files)} QRadar JSON rules")

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      QRADAR_HOST: ${{ secrets.QRADAR_HOST }}
      QRADAR_SEC_TOKEN: ${{ secrets.QRADAR_SEC_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deployment dependency
        run: pip install -r qradar/requirements.txt
      - name: Run QRadar rule API integration
        if: env.QRADAR_HOST != '' && env.QRADAR_SEC_TOKEN != ''
        run: python qradar/deploy_qradar.py
      - name: Explain skipped QRadar integration
        if: env.QRADAR_HOST == '' || env.QRADAR_SEC_TOKEN == ''
        run: echo "QRadar deployment skipped. Add QRADAR_HOST and QRADAR_SEC_TOKEN after the QRadar lab is available."
