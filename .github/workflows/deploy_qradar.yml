name: Deploy SIEM Rules to QRadar

on:
  push:
    branches: [main]
    paths:
      - "qradar/rules/**"
      - "qradar/deploy_qradar.py"
      - "qradar/requirements.txt"
      - ".github/workflows/deploy_qradar.yml"
  pull_request:
    paths:
      - "qradar/rules/**"
      - "qradar/deploy_qradar.py"
      - "qradar/requirements.txt"
      - ".github/workflows/deploy_qradar.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: pip install -r qradar/requirements.txt
      - name: Validate QRadar JSON rules
        shell: python
        run: |
          import glob
          import json

          required = {
              "id", "title", "status", "description", "author", "date",
              "tags", "mitre", "logsource", "qradar", "aql",
              "falsepositives", "level"
          }
          files = sorted(glob.glob("qradar/rules/*.json"))
          assert len(files) == 10, f"Expected 10 QRadar rule files, found {len(files)}"
          ids = set()
          for path in files:
              with open(path, encoding="utf-8") as handle:
                  rule = json.load(handle)
              missing = required.difference(rule)
              assert not missing, f"{path}: missing {sorted(missing)}"
              assert rule["id"] not in ids, f"{path}: duplicate rule id"
              assert rule["aql"].strip().upper().startswith("SELECT "), f"{path}: invalid AQL start"
              assert "rule_name" in rule["qradar"], f"{path}: missing qradar.rule_name"
              assert "technique" in rule["mitre"], f"{path}: missing mitre.technique"
              ids.add(rule["id"])
          print(f"Validated {len(files)} QRadar JSON rules")

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      QRADAR_HOST: ${{ secrets.QRADAR_HOST }}
      QRADAR_SEC_TOKEN: ${{ secrets.QRADAR_SEC_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deployment dependency
        run: pip install -r qradar/requirements.txt
      - name: Run QRadar rule API integration
        if: env.QRADAR_HOST != '' && env.QRADAR_SEC_TOKEN != ''
        run: python qradar/deploy_qradar.py
      - name: Explain skipped QRadar integration
        if: env.QRADAR_HOST == '' || env.QRADAR_SEC_TOKEN == ''
        run: echo "QRadar deployment skipped. Add QRADAR_HOST and QRADAR_SEC_TOKEN after the QRadar lab is available."
