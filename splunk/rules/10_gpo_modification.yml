name: Rule_10_Active_Directory_GPO_Modification
search: |
  index=windows sourcetype="XmlWinEventLog:Security" EventCode=5136 ObjectClass=groupPolicyContainer ObjectDN="*CN=Policies,CN=System*" | eval actor=coalesce(SubjectUserName,Account_Name) | stats count AS modification_count values(AttributeLDAPDisplayName) AS modified_attributes values(AttributeValue) AS attribute_values by _time host actor ObjectDN OperationType | where modification_count>=1
description: Tracks modifications to Active Directory Group Policy Objects. Requires Directory Service Changes auditing on a Domain Controller.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 4
