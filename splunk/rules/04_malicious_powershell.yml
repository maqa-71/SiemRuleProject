name: Rule_04_Malicious_PowerShell_Encoded_Command
search: |
  index=windows ((sourcetype="XmlWinEventLog:Microsoft-Windows-PowerShell/Operational" EventCode=4104) OR (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\powershell.exe") OR (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\pwsh.exe")) | eval command=lower(coalesce(ScriptBlockText,CommandLine,Message)) | where match(command,"(?i)(-enc(odedcommand)?\\s|frombase64string|invoke-expression|iex\\s|downloadstring|-windowstyle\\s+hidden|-executionpolicy\\s+bypass)") | table _time host User Image ParentImage CommandLine ScriptBlockText ProcessId ParentProcessId
description: Detects encoded, hidden, bypassed, download or in-memory PowerShell execution patterns. Requires PowerShell 4104 or Sysmon Event ID 1.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 4
