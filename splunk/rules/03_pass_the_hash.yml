name: Rule_03_Pass_The_Hash_NTLM_Anomalous_Logon
search: |
  index=windows sourcetype="XmlWinEventLog:Security" EventCode=4624 LogonType=3 AuthenticationPackageName=NTLM LogonProcessName=NtLmSsp | eval user=coalesce(TargetUserName,Account_Name), src=coalesce(IpAddress,Source_Network_Address), workstation=coalesce(WorkstationName,Workstation_Name) | where isnotnull(src) AND src!="-" AND user!="$" | stats count AS logon_count values(workstation) AS workstations values(KeyLength) AS key_lengths by _time host user src | where logon_count>=1
description: Identifies NTLM network logons that require asset allowlisting and correlation before they can be treated as possible Pass-the-Hash activity.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 4
