name: Rule_13_Ransomware_Mass_File_Modification
search: |
  index=windows sourcetype="XmlWinEventLog:Security" EventCode=4663 (AccessMask="0x2" OR AccessMask="0x6") | eval user=coalesce(SubjectUserName,Account_Name) | bin _time span=1m | stats dc(ObjectName) AS unique_files values(ObjectName) AS modified_files by _time host user SubjectLogonId ProcessName | where unique_files>20
description: Detects a process or logon session modifying more than 20 distinct files in one minute, which may indicate ransomware. Requires Object Access auditing.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 5
