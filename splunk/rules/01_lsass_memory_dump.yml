name: Rule_01_LSASS_Memory_Dump_Detection
title: Windows - Potential LSASS Memory Dump
description: '[DRAFT] Detects suspicious access to LSASS memory that may indicate credential dumping with tools such as Mimikatz
  or ProcDump. Requires Sysmon Event ID 10.'
status: draft
version: 0.1.0
author: Maqa
platform: splunk
data_source:
  index: windows
  sourcetype: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
  event_ids:
  - '10'
mitre_attack:
  tactic:
    id: TA0006
    name: Credential Access
  technique:
    id: T1003.001
    name: LSASS Memory
search: index=windows sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=10 TargetImage="*\\lsass.exe"
  (GrantedAccess="*0x1038*" OR GrantedAccess="*0x1438*" OR GrantedAccess="*0x143a*" OR GrantedAccess="*0x1fffff*") NOT (SourceImage="*\\Sysmon64.exe"
  OR SourceImage="*\\Sysmon64a.exe") | table _time host SourceUser SourceImage SourceProcessId TargetImage TargetProcessId
  GrantedAccess CallTrace
schedule:
  cron: '*/5 * * * *'
  earliest: -10m@m
  latest: now
alert:
  enabled: false
  type: number of events
  comparator: greater than
  threshold: 0
  track: true
  severity: 5
suppression:
  enabled: true
  period: 30m
  fields:
  - host
  - SourceImage
validation:
  telemetry_verified: false
  positive_test: pending
  negative_test: pending
  lab_validated: false
