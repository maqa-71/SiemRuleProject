name: Rule_07_LOLBAS_Certutil_File_Download
search: |
  index=windows sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\certutil.exe" | eval command=lower(CommandLine) | where match(command,"(?i)(-urlcache|-verifyctl|-split|-decode).*(https?://|ftp://)") OR match(command,"(?i)https?://") | table _time host User ParentImage Image CommandLine ProcessId ParentProcessId Hashes
description: Detects certutil.exe being used to retrieve or process content from remote URLs.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 4
