name: Rule_02_Kerberoasting_Attack_TGS_Request
search: |
  index=windows sourcetype="XmlWinEventLog:Security" EventCode=4769 TicketEncryptionType="0x17" ServiceName!="*$" | eval user=coalesce(TargetUserName,Account_Name), src=coalesce(IpAddress,Client_Address) | bin _time span=5m | stats count AS tgs_requests dc(ServiceName) AS unique_services values(ServiceName) AS services by _time host user src | where tgs_requests>=3 OR unique_services>=3
description: Detects suspicious RC4-encrypted TGS requests targeting service accounts, which can be associated with Kerberoasting. Requires Domain Controller Security events.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 4
