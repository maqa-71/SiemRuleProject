name: Rule_12_Registry_Run_Keys_Malicious_Modification
search: |
  index=windows sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" (EventCode=12 OR EventCode=13 OR EventCode=14) (TargetObject="*\\Microsoft\\Windows\\CurrentVersion\\Run\\*" OR TargetObject="*\\Microsoft\\Windows\\CurrentVersion\\RunOnce\\*") | eval details=lower(coalesce(Details,NewName)) | where match(details,"(?i)(\\\\appdata|\\\\temp|\\\\users\\\\public|powershell|cmd\\.exe|wscript|cscript|mshta|rundll32|\\.ps1|\\.bat|https?://)") | table _time host User Image EventCode TargetObject Details NewName ProcessId
description: Detects suspicious Run or RunOnce registry persistence pointing to scripts, LOLBins or user-writable locations.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 3
