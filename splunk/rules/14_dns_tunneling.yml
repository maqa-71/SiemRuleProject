name: Rule_14_DNS_Tunneling_Exfiltration_Detection
search: |
  index=network sourcetype=dns_logs | eval dns_query=lower(coalesce(query,QueryName,query_name)), src=coalesce(src_ip,src,client_ip), query_length=len(dns_query) | where isnotnull(dns_query) AND isnotnull(src) | bin _time span=5m | stats count AS query_count dc(dns_query) AS unique_queries max(query_length) AS max_query_length avg(query_length) AS avg_query_length values(record_type) AS record_types by _time src | where (max_query_length>50 AND query_count>100) OR (unique_queries>80 AND avg_query_length>40)
description: Detects clients generating high volumes of long or highly unique DNS queries that may indicate DNS tunneling or exfiltration.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 4
