name: Rule_15_Process_Creating_Webshell_In_Webroot
search: |
  index=windows sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=11 | eval target=lower(TargetFilename), process=lower(Image) | where match(target,"(?i)(\\\\inetpub\\\\wwwroot\\\\|\\\\tomcat\\\\webapps\\\\|\\\\xampp\\\\htdocs\\\\|\\\\apache[^\\\\]*\\\\htdocs\\\\).+\\.(aspx|ashx|asmx|php|jsp|jspx|war)$") | where NOT match(process,"(?i)(msiexec|trustedinstaller|tomcat|java|w3wp)\\.exe$") | table _time host User Image ProcessId TargetFilename Hashes
description: Detects uncommon processes creating potential webshell files inside IIS, Tomcat, XAMPP or Apache webroot directories.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 5
