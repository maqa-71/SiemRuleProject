name: Rule_05_Persistence_Via_Scheduled_Task_Creation
search: |
  index=windows sourcetype="XmlWinEventLog:Security" EventCode=4698 | eval task_content=lower(coalesce(TaskContent,Task_Content,Message)), task_name=coalesce(TaskName,Task_Name) | where match(task_content,"(?i)(\\\\appdata\\\\local\\\\temp|\\\\users\\\\public|\\\\windows\\\\temp|powershell|cmd\\.exe|wscript|cscript|mshta|rundll32|\\.ps1|\\.bat|https?://)") | table _time host SubjectUserName task_name task_content
description: Detects scheduled tasks that execute scripts, LOLBins, URLs or payloads from user-writable directories.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 3
