name: Rule_08_Persistence_Via_New_Windows_Service
search: |
  index=windows sourcetype="XmlWinEventLog:System" EventCode=7045 | eval service_name=coalesce(ServiceName,Service_Name), image_path=lower(coalesce(ImagePath,Service_File_Name)) | where match(image_path,"(?i)(\\\\users\\\\[^\\\\]+\\\\appdata|\\\\windows\\\\temp|\\\\users\\\\public|powershell|cmd\\.exe|wscript|cscript|mshta|rundll32)") | table _time host service_name image_path ServiceType StartType AccountName
description: Detects newly installed Windows services pointing to user-writable paths or suspicious command interpreters.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 4
