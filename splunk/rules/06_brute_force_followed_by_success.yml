name: Rule_06_Brute_Force_Followed_By_Successful_Login
search: |
  index=windows sourcetype="XmlWinEventLog:Security" (EventCode=4624 OR EventCode=4625) | eval user=coalesce(TargetUserName,Account_Name), src=coalesce(IpAddress,Source_Network_Address) | where isnotnull(user) AND isnotnull(src) AND src!="-" | bin _time span=15m | stats count(eval(EventCode=4625)) AS failures count(eval(EventCode=4624)) AS successes max(eval(if(EventCode=4625,_time,null()))) AS last_failure min(eval(if(EventCode=4624,_time,null()))) AS first_success values(LogonType) AS logon_types by _time host user src | where failures>=5 AND successes>=1 AND first_success>=last_failure
description: Detects five or more failed logons followed by a successful authentication for the same user, source and host within 15 minutes.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -20m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 5
