name: Rule_09_UAC_Bypass_Via_Fodhelper
search: |
  index=windows sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 ParentImage="*\\fodhelper.exe" NOT (Image="*\\mmc.exe" OR Image="*\\control.exe") | table _time host User ParentImage ParentCommandLine Image CommandLine IntegrityLevel ProcessId ParentProcessId
description: Detects unusual child processes spawned by fodhelper.exe that can indicate UAC bypass.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 4
