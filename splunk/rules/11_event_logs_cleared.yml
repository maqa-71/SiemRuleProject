name: Rule_11_Windows_Event_Logs_Cleared
search: |
  index=windows ((sourcetype="XmlWinEventLog:Security" EventCode=1102) OR (sourcetype="XmlWinEventLog:System" EventCode=104)) | eval actor=coalesce(SubjectUserName,Account_Name,User) | stats count AS clear_events values(EventCode) AS event_codes values(Channel) AS channels by _time host actor
description: Detects explicit clearing of Windows Security or System event logs, a critical defense-evasion indicator.
cron_schedule: '*/5 * * * *'
dispatch_earliest_time: -10m@m
dispatch_latest_time: now
enableSched: 0
alert_type: number of events
alert_comparator: greater than
alert_threshold: 0
alert_track: 1
alert_severity: 5
