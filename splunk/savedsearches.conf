description = [DRAFT] Detects uncommon processes creating potential webshell files inside IIS, Tomcat, XAMPP or Apache webroot directories.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = host,Image,TargetFilename
