[Rule_13_Ransomware_Mass_File_Modification]
search = index=windows sourcetype="XmlWinEventLog:Security" EventCode=4663 (AccessMask="0x2" OR AccessMask="0x6") | eval user=coalesce(SubjectUserName,Account_Name) | bin _time span=1m | stats dc(ObjectName) AS unique_files values(ObjectName) AS modified_files by _time host user SubjectLogonId ProcessName | where unique_files>20
description = [DRAFT] Detects a process or logon session modifying more than 20 distinct files in one minute, which may indicate ransomware. Requires Object Access auditing.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = host,user,ProcessName

[Rule_14_DNS_Tunneling_Exfiltration_Detection]
search = index=network sourcetype=dns_logs | eval dns_query=lower(coalesce(query,QueryName,query_name)), src=coalesce(src_ip,src,client_ip), query_length=len(dns_query) | where isnotnull(dns_query) AND isnotnull(src) | bin _time span=5m | stats count AS query_count dc(dns_query) AS unique_queries max(query_length) AS max_query_length avg(query_length) AS avg_query_length values(record_type) AS record_types by _time src | where (max_query_length>50 AND query_count>100) OR (unique_queries>80 AND avg_query_length>40)
description = [DRAFT] Detects clients generating high volumes of long or highly unique DNS queries that may indicate DNS tunneling or exfiltration.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 60m
alert.suppress.fields = src

[Rule_15_Process_Creating_Webshell_In_Webroot]
