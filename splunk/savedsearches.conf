description = [DRAFT] Detects suspicious Run or RunOnce registry persistence pointing to scripts, LOLBins or user-writable locations.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
