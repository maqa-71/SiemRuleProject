description = [DRAFT] Detects certutil.exe being used to retrieve or process content from remote URLs.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = host,User,CommandLine

