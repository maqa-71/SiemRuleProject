# SIEM Rule Project - Splunk saved searches
# Source: rules.docx supplied by the project owner
# Status: DRAFT - index, sourcetype and field names must be validated in the lab.
# All detections are disabled until telemetry and positive/negative tests are confirmed.

[Rule_01_LSASS_Memory_Dump_Detection]
search = index=windows sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=10 TargetImage="*\\lsass.exe" (GrantedAccess="*0x1038*" OR GrantedAccess="*0x1438*" OR GrantedAccess="*0x143a*" OR GrantedAccess="*0x1fffff*") NOT (SourceImage="*\\Sysmon64.exe" OR SourceImage="*\\Sysmon64a.exe") | table _time host SourceUser SourceImage SourceProcessId TargetImage TargetProcessId GrantedAccess CallTrace
description = [DRAFT] Detects suspicious access to LSASS memory that may indicate credential dumping with tools such as Mimikatz or ProcDump. Requires Sysmon Event ID 10.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = host,SourceImage

[Rule_02_Kerberoasting_Attack_TGS_Request]
search = index=windows sourcetype="XmlWinEventLog:Security" EventCode=4769 TicketEncryptionType="0x17" ServiceName!="*$" | eval user=coalesce(TargetUserName,Account_Name), src=coalesce(IpAddress,Client_Address) | bin _time span=5m | stats count AS tgs_requests dc(ServiceName) AS unique_services values(ServiceName) AS services by _time host user src | where tgs_requests>=3 OR unique_services>=3
description = [DRAFT] Detects suspicious RC4-encrypted TGS requests targeting service accounts, which can be associated with Kerberoasting. Requires Domain Controller Security events.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = host,user,src

[Rule_03_Pass_The_Hash_NTLM_Anomalous_Logon]
search = index=windows sourcetype="XmlWinEventLog:Security" EventCode=4624 LogonType=3 AuthenticationPackageName=NTLM LogonProcessName=NtLmSsp | eval user=coalesce(TargetUserName,Account_Name), src=coalesce(IpAddress,Source_Network_Address), workstation=coalesce(WorkstationName,Workstation_Name) | where isnotnull(src) AND src!="-" AND user!="$" | stats count AS logon_count values(workstation) AS workstations values(KeyLength) AS key_lengths by _time host user src | where logon_count>=1
description = [DRAFT] Identifies NTLM network logons that require asset allowlisting and correlation before they can be treated as possible Pass-the-Hash activity.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 60m
alert.suppress.fields = host,user,src

[Rule_04_Malicious_PowerShell_Encoded_Command]
search = index=windows ((sourcetype="XmlWinEventLog:Microsoft-Windows-PowerShell/Operational" EventCode=4104) OR (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\powershell.exe") OR (sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 Image="*\\pwsh.exe")) | eval command=lower(coalesce(ScriptBlockText,CommandLine,Message)) | where match(command,"(?i)(-enc(odedcommand)?\\s|frombase64string|invoke-expression|iex\\s|downloadstring|-windowstyle\\s+hidden|-executionpolicy\\s+bypass)") | table _time host User Image ParentImage CommandLine ScriptBlockText ProcessId ParentProcessId
description = [DRAFT] Detects encoded, hidden, bypassed, download or in-memory PowerShell execution patterns. Requires PowerShell 4104 or Sysmon Event ID 1.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = host,User,Image

[Rule_05_Persistence_Via_Scheduled_Task_Creation]
search = index=windows sourcetype="XmlWinEventLog:Security" EventCode=4698 | eval task_content=lower(coalesce(TaskContent,Task_Content,Message)), task_name=coalesce(TaskName,Task_Name) | where match(task_content,"(?i)(\\\\appdata\\\\local\\\\temp|\\\\users\\\\public|\\\\windows\\\\temp|powershell|cmd\\.exe|wscript|cscript|mshta|rundll32|\\.ps1|\\.bat|https?://)") | table _time host SubjectUserName task_name task_content
description = [DRAFT] Detects scheduled tasks that execute scripts, LOLBins, URLs or payloads from user-writable directories.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 3
alert.suppress = 1
alert.suppress.period = 30m
alert.suppress.fields = host,task_name

[Rule_06_Brute_Force_Followed_By_Successful_Login]
search = index=windows sourcetype="XmlWinEventLog:Security" (EventCode=4624 OR EventCode=4625) | eval user=coalesce(TargetUserName,Account_Name), src=coalesce(IpAddress,Source_Network_Address) | where isnotnull(user) AND isnotnull(src) AND src!="-" | bin _time span=15m | stats count(eval(EventCode=4625)) AS failures count(eval(EventCode=4624)) AS successes max(eval(if(EventCode=4625,_time,null()))) AS last_failure min(eval(if(EventCode=4624,_time,null()))) AS first_success values(LogonType) AS logon_types by _time host user src | where failures>=5 AND successes>=1 AND first_success>=last_failure
description = [DRAFT] Detects five or more failed logons followed by a successful authentication for the same user, source and host within 15 minutes.
cron_schedule = */5 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = now
enableSched = 0
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 60m
alert.suppress.fields = host,user,src

